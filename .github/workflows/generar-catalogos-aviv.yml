name: Generar Catálogos Aviv
run-name: Generar Catálogos Aviv

on:
  schedule:
    - cron: '0 12 * * 1,4'   # Lunes y jueves 9:00 AM Chile (UTC-3) — ajusta si quieres otra frecuencia
  workflow_dispatch:          # Botón "Run workflow" para correrlo a mano

permissions:
  contents: write             # necesario para guardar catalogos_links.json de vuelta en el repo

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Ghostscript (compresión de PDF)
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: Instalar dependencias
        run: npm install

      # imagenes_cache.json puede pesar más de 100MB (límite de git para archivos
      # en el repo), así que se guarda con el cache de Actions, NO como commit.
      - name: Restaurar cache de imágenes
        uses: actions/cache/restore@v4
        with:
          path: imagenes_cache.json
          key: imagenes-cache-${{ github.run_id }}
          restore-keys: |
            imagenes-cache-

      - name: Generar catálogos
        env:
          ODOO_URL:              ${{ secrets.ODOO_URL }}
          ODOO_DB:                ${{ secrets.ODOO_DB }}
          ODOO_USERNAME:           ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD:           ${{ secrets.ODOO_PASSWORD }}
          GH_TOKEN_RELEASES:       ${{ secrets.GH_TOKEN_RELEASES }}
          GH_REPO_OWNER:           ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME:            ${{ secrets.GH_REPO_NAME }}
        run: node generar-catalogos-aviv.js

      - name: Guardar cache de imágenes actualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: imagenes_cache.json
          key: imagenes-cache-${{ github.run_id }}

      - name: Guardar catalogos_links.json en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add catalogos_links.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en catalogos_links.json"
          else
            git commit -m "Actualizar links de catálogos [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
